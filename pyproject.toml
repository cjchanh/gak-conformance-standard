[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gak-conformance"
version = "0.1.0"
description = "Vendor-neutral mechanical scorer for the GAK Conformance Standard (gak-conformance/v1)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "CJ — Centennial Defense Systems" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Intended Audience :: Developers",
  "Development Status :: 3 - Alpha",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gak-conformance = "gak_conformance.cli:main"

[project.urls]
Homepage = "https://github.com/cjchanh/gak-conformance-standard"

[tool.setuptools.packages.find]
include = ["gak_conformance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
